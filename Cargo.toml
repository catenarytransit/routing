[package]
name = "routing"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = { version = "*", features = ["serde"] }
bytemuck = { version = "*", features = ["derive", "zeroable_maybe_uninit"] }
chrono = "*"
clap = { version = "*", features = ["derive"] }
geo = { version = "*", features = ["serde", "use-serde"] }
gtfs-structures = "*"
osmpbfreader = "*"
rand = "*"
regex = "*"
ron = "*"
rstar = "0.13.0"
serde = { version = "*", features = ["derive"] }
tokio = { version = "*", features = ["full"] }
# typenum = "*"
# rstar = "*"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "*"

[profile.release]
debug = true
